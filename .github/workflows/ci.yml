name: DynamicFormBuilder CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  test:

    name: Test Application

    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Check Project Structure
      run: |
        pwd
        find . -name "*.csproj"


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'


    - name: Restore Packages
      run: |
        cd DynamicFormBuilder/DynamicFormBuilder
        dotnet restore


    - name: Build Application
      run: |
        cd DynamicFormBuilder/DynamicFormBuilder
        dotnet build --configuration Release --no-restore

    - name: Run Test and Generate Result
      run: |
        cd DynamicFormBuilder/DynamicFormBuilder
        dotnet test \
        --configuration Release \
        --no-build \
        --logger "trx;LogFileName=test-result.trx" \
        --results-directory ./TestResults


    - name: Upload Test Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dynamicformbuilder-test-result
        path: DynamicFormBuilder/DynamicFormBuilder/TestResults

  deploy:

    name: Deploy Application

    needs: test

    runs-on: self-hosted


    steps:
    - name: Upload Test Result
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: dynamicformbuilder-test-result
          path: DynamicFormBuilder/DynamicFormBuilder/TestResults
      
    - name: Check Test Result Folder
      if: always()
      run: |
        ls -la DynamicFormBuilder/DynamicFormBuilder/TestResults
        
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'


    - name: Publish Application
      run: |
        cd DynamicFormBuilder/DynamicFormBuilder
        dotnet publish \
        --configuration Release \
        --output /var/www/dynamicformbuilder


    - name: Restart Application
      run: |
        sudo systemctl restart dynamicbuilder.service


    - name: Verify Application
      run: |
        sudo systemctl status dynamicbuilder.service --no-pager
